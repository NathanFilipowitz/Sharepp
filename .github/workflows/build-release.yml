# File:    build-release.yml
# Date:    2026-04-20
# Author:  Nathan Filipowitz
# Desc:    Automatic build and release CD workflow

name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace "^v", ""
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'

      - name: Build with Flet
        env:
          PYTHONUTF8: "1"
        run: |
          Copy-Item requirements.txt src\requirements.txt
          cd src
          flet build windows --verbose
          cd ..
      
      - name: Rename exe
        run: Rename-Item src\build\windows\src.exe src\build\windows\sharepp.exe

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Update version in setup.iss
        run: |
          $version = "${{ env.VERSION }}"
          $content = Get-Content setup.iss -Raw -Encoding UTF8
          $content = $content -replace '(#define AppVersion ")[^"]*(")', "`${1}$version`${2}"
          Set-Content setup.iss $content -Encoding UTF8

      - name: Build installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
      
      - name: Build CLI with PyInstaller
        env:
          PYTHONUTF8: "1"
        working-directory: src
        run: |
          pyinstaller --onefile --name sharepp-cli --console --clean --paths . --add-data "views;views" --add-data "controllers;controllers" --add-data "models;models" cli.py
        
      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: Share++ ${{ env.VERSION }}
          body: |
            ## Share++ v${{ env.VERSION }}

            ### Installateur Windows (GUI)
            Téléchargez la version par défaut de Share++ **SharePlusPlus_Setup_${{ env.VERSION }}.exe** et exécutez-le pour démarrer l'assistant d'installation.

            ### Version CLI ()
            Téléchargez la version en ligne de commande de Share++ **sharepp-cli.exe** (Recommendé pour les utilisateurs expérimentés).
            ```
            sharepp-cli.exe C:\mon-dossier [--port 3001] [--secure]
            ```
          files: |
            ./installer_output/SharePlusPlus_Setup_${{ env.VERSION }}.exe
            ./src/dist/sharepp-cli.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}